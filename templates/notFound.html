<!DOCTYPE html>
<html lang="en" class="h-full">
<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="tailwind.js"></script>

</head>
<body class="bg-zinc-950 text-zinc-100 min-h-full antialiased flex items-center justify-center p-4">
	
	<!-- 404 Visual Content Card -->
	<div class="flex flex-col items-center text-center gap-4 max-w-sm">
		
		<!-- Danger / Warning Badge Indicator -->
		<div class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-zinc-500 shadow-xl relative group">
			<div class="absolute -inset-0.5 bg-indigo-500/10 rounded-2xl blur opacity-0 group-hover:opacity-100 transition duration-500"></div>
			<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-indigo-400 relative z-10 animate-pulse">
				<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
			</svg>
		</div>

		<div class="space-y-1">
			<h1 class="text-xl font-bold tracking-tight text-zinc-100">Paste Not Found</h1>
			<p class="text-sm text-zinc-500 leading-relaxed max-w-[280px]">
				The link might be broken, expired, or burned after its initial opening.
			</p>
		</div>

	</div>

</body>
</html>
