<!DOCTYPE html>
<html lang="en" class="h-full">
<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="tailwind.js"></script>

</head>

<body class="bg-zinc-950 text-zinc-100 min-h-full antialiased flex justify-center px-4">
	
	<div class="w-full max-w-sm flex flex-col items-center">

		<form action="/{{.Path}}" style="margin-top: 100px" class="w-full">

			<!-- Central Authentication Card -->
			<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl flex flex-col gap-4">
				
				<div class="flex flex-col items-center text-center gap-1.5 mb-2">
					<!-- Lock Icon -->
					<div class="p-3 bg-zinc-950 border border-zinc-850 rounded-xl text-indigo-400 mb-1 shadow-inner">
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
							<path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
						</svg>
					</div>
					<h1 class="text-base font-bold text-zinc-100 tracking-tight">Protected Paste</h1>
					<p class="text-xs text-zinc-500 font-medium">This file requires a password to view</p>
				</div>

				<!-- Password Field -->
				<div class="w-full">
					<input 
						name="key" 
						type="password" 
						placeholder="Enter password" 
						class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/50 transition shadow-inner"
					/>
				</div>
				
				<!-- Submit Trigger -->
				<button 
					type="submit"
					class="w-full bg-zinc-800 hover:bg-indigo-950/30 hover:text-indigo-400 hover:border-indigo-900/50 text-zinc-200 text-xs font-semibold py-2.5 px-4 rounded-xl border border-zinc-700 active:scale-[0.98] transition shadow-md"
				>
					Unlock Paste
				</button>
			</div>

		</form>

	</div>
	
</body>

</html>
